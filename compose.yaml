name: pulselens
services:
  postgres:
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_USER: pulselens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pulselens_development
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulselens -d pulselens_development"]
      interval: 2s
      timeout: 2s
      retries: 30
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.46.6
    environment:
      CLICKHOUSE_USER: pulselens
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./config/clickhouse/listen.xml:/etc/clickhouse-server/config.d/listen.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  postgres_data:
  clickhouse_data:
