default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("POSTGRES_HOST", "127.0.0.1").to_json %>
  port: <%= Integer(ENV.fetch("POSTGRES_PORT", "5432")) %>
  username: <%= ENV.fetch("POSTGRES_USER", "pulselens").to_json %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "").to_json %>
  pool: <%= Integer(ENV.fetch("RAILS_MAX_THREADS", "5")) %>
  checkout_timeout: 2
  connect_timeout: 2
  variables:
    statement_timeout: 1000

development:
  <<: *default
  database: pulselens_development

test:
  <<: *default
  database: pulselens_test

production:
  <<: *default
  database: pulselens_production
